baseURL: 'https://ppphp.github.io/'
languageCode: 'zh-cn'
title: "a usr/bin"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
hasCJKLanguage: true

minify:
  disableXML: true
  minifyOutput: true

params:
  comments: true
  disqusShortname: 'ppphp-1'
  social:
    - name: github
      url: "https://github.com/ppphp"
    - name: twitter
      url: "https://twitter.com/"
    - name: stackoverflow
      url: "https://stackoverflow.com"
    - name: rss
      url: "/index.xml"

  title: "a usr/bin"
  description: "个人技术博客，分享编程、工具使用和思考"
  keywords: [博客, 技术, 编程, 工具, 思考]
  author: ppphp
  DateFormat: "2006-1-2"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  # profile-mode
  profileMode:
    enabled: false
    title: "a usr/bin"
    subtitle: "个人技术博客"
    imageUrl: "img/avatar.png"
    imageWidth: 120
    imageHeight: 120
    imageTitle: "avatar"
    buttons:
      - name: 文章
        url: posts
      - name: 标签
        url: tags
      - name: 归档
        url: archives

  # home-info mode
  homeInfoParams:
    Title: "Hi there 👋"
    Content: "欢迎来到我的个人技术博客，这里分享我在编程、工具使用和思考方面的心得体会。"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  editPost:
    URL: "https://github.com/ppphp/ppphp.github.io/tree/master/content"
    Text: "建议修改"
    appendFilePath: true

  # 搜索优化
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # 社交媒体图标
  socialIcons: []

  # SEO设置
  env: production
  analytics:
    google:
      SiteVerificationTag: ""

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 40
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 50
    - identifier: search
      name: 搜索
      url: /search/
      weight: 60
    - identifier: works
      name: 作品
      url: /works/
      weight: 70

# 代码高亮设置
pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: true
    style: monokai
    guessSyntax: true
    codeFences: true

# 模块设置
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
      # 使用最新版本的PaperMod主题
      disable: false

# 输出设置
outputs:
    home:
        - HTML
        - RSS
        - JSON
    section:
        - HTML
        - RSS
    taxonomy:
        - HTML
        - RSS
    term:
        - HTML
        - RSS

# 隐私设置
privacy:
  youtube:
    disable: false
    privacyEnhanced: true
  vimeo:
    disable: false
    enableDNT: true
  x:
    disable: false
    enableDNT: true
  instagram:
    disable: false
    simple: true
  googleAnalytics:
    disable: true

# 安全设置
security:
  enableInlineShortcodes: false
  exec:
    allow:
      - dart-sass-embedded
      - go run
      - go
    osEnv:
      - (?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$
    funcs:
      - getenv
    allowExec: true
    allowOSExec: true
    allowExecOrigin: []